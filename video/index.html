<!doctype html>
<!-- Gainsay walkthrough. A seek(t) film: every frame is a pure function of t. No transitions, timers, Math.random or carried state. -->
<html><head><meta charset="utf-8"><title>Gainsay walkthrough</title>
<style>

<script>
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const L = layout(W, H), u = L.u, P = L.portrait;

// ---- timeline (16:9 master, 2.4 s bars at 100 BPM). SOL is the Solana slot: a red placeholder until the tab is live.
const DESIGN = [
  { id: 's01', from: 0.0, to: 7.2 }, { id: 's02', from: 7.2, to: 14.4 }, { id: 's03', from: 14.4, to: 31.2 },
  { id: 's04', from: 31.2, to: 38.4 }, { id: 's05', from: 38.4, to: 50.4 }, { id: 's06a', from: 50.4, to: 57.6 },
  { id: 's06b', from: 57.6, to: 64.8 }, { id: 's07', from: 64.8, to: 69.6 }, { id: 's08', from: 69.6, to: 79.2 },
  { id: 's09', from: 79.2, to: 86.4 }, { id: 's10', from: 86.4, to: 96.0 }, { id: 'sol', from: 96.0, to: 110.4 },
  { id: 's12', from: 110.4, to: 120.0 },
];
const PL = window.PLAN || null;   // plan.js: real shot lengths fitted to the narration, with a design-time warp per shot
const SHOTS = PL ? PL.shots : DESIGN;
const r2d = (sh, r) => { if (!sh.pts) return r - sh.from; const p = sh.pts, x = r - sh.from; if (x <= 0) return x; for (let i = 1; i < p.length; i++) if (x <= p[i][0]) return p[i - 1][1] + (x - p[i - 1][0]) * (p[i][1] - p[i - 1][1]) / (p[i][0] - p[i - 1][0]); return p[p.length - 1][1]; };
// 9:16 cut re-uses shots as [shot, from, to] in the shot's own time (Solana is left out until it is live).
const VSEG = [['s01', 0, 4.8], ['s03', 0, 14.4], ['s06a', 0, 7.2], ['s12', 2.4, 7.2]];
const VDUR = VSEG.reduce((a, s) => a + s[2] - s[1], 0);
window.FILM = { w: W, h: H, dur: PL ? (P ? PL.vtotal : PL.total) : (P ? VDUR : 120.0), fps: 30 };

const C = { bg: '#171410', card: '#211d18', line: '#3a342b', ink: '#f7f4ee', mute: '#a89f91', blue: '#78b0de', green: '#52c284', red: '#ec5b52', amber: '#e3a43c', paper: '#f7f4ee', ph: '#ff3b30' };
const F = { d: '"Newsreader", Georgia, serif', s: '"IBM Plex Sans", system-ui, sans-serif', m: '"IBM Plex Mono", ui-monospace, monospace' };
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');

// ---- assets
const IMG = {};
function img(name, src) { const i = new Image(); i.src = src; IMG[name] = i; return i.decode().catch(() => { IMG[name] = null; console.warn('missing asset: ' + src); }); }
const SEQ = {}, CUR = {};
function seq(name, dir, fps, frames) { SEQ[name] = { dir, fps, frames, cache: new Map() }; }
async function seqFrame(name, t) {
  const s = SEQ[name], n = Math.min(s.frames, Math.max(1, Math.floor(t * s.fps + 1e-6) + 1)), key = String(n).padStart(5, '0');
  if (!s.cache.has(key)) { const i = new Image(); i.src = `${s.dir}/${key}.jpg`; s.cache.set(key, i.decode().then(() => i, () => null)); if (s.cache.size > 40) s.cache.delete(s.cache.keys().next().value); }
  return s.cache.get(key);
}
seq('te', 'assets/cap-tooearly/flow', 30, 190);   // live check, Bears vs. Lions, 26 Nov
seq('pr', 'assets/cap-prop/flow', 30, 224);       // live check, Devin Booker assists prop, 26 Nov
seq('wt', 'assets/cap-watch/flow', 30, 200);
seq('sl2', 'assets/cap-solana2/flow', 30, 376);    // live Solana tab with the recorded games, 26 Nov      // live Watch tab, 26 Nov
window.ready = Promise.all([
  ...[400, 500].map(w => document.fonts.load(`${w} 100px "Newsreader"`)), ...[400, 500, 600].map(w => document.fonts.load(`${w} 40px "IBM Plex Sans"`)),
  ...[400, 500].map(w => document.fonts.load(`${w} 40px "IBM Plex Mono"`)),
  img('sheet', 'assets/shots/sheet-recorded-open.png'), img('land', 'assets/shots/check-landing.png'), img('how', 'assets/shots/how.png'),
  img('tesheet', 'assets/shots/result-tooearly.png'), img('solfull', 'assets/shots/solana-full.png'),
]);

// ---- helpers
function text(str, x, y, size, o = {}) {
  g.save(); g.font = `${o.weight || 400} ${size}px ${o.font || F.s}`; g.fillStyle = o.color || C.ink;
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic'; g.globalAlpha *= o.alpha ?? 1;
  if (o.track) g.letterSpacing = o.track + 'px';
  g.fillText(str, x, y); g.restore();
}
function tw(str, size, font = F.s, weight = 400) { g.save(); g.font = `${weight} ${size}px ${font}`; const w = g.measureText(str).width; g.restore(); return w; }
function wrap(str, size, maxW, font = F.s, weight = 400) {
  g.save(); g.font = `${weight} ${size}px ${font}`; const out = []; let cur = '';
  for (const w of str.split(' ')) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); g.restore(); return out;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function chip(str, x, y, color, o = {}) {   // honesty label; x = left, y = centre
  const s = (o.size || 19) * u, w = tw(str, s, F.m, 500) + 28 * u, h = s * 2;
  g.save(); g.globalAlpha *= o.alpha ?? 1; rr(x, y - h / 2, w, h, h / 2); g.fillStyle = 'rgba(23,20,16,.9)'; g.fill(); g.strokeStyle = color; g.lineWidth = 2 * u; g.stroke(); g.restore();
  text(str, x + 14 * u, y + s * .34, s, { font: F.m, weight: 500, color, alpha: o.alpha }); return w;
}
function chipRow(items, x, y, maxW, alpha = 1) {   // wraps into rows
  let xx = x, yy = y; for (const [s, col] of items) { const w = tw(s, 19 * u, F.m, 500) + 28 * u; if (xx + w > x + maxW) { xx = x; yy += 50 * u; } chip(s, xx, yy, col, { alpha }); xx += w + 12 * u; } return yy;
}
const ap = (lt, t0, d = .45) => easeOut(seg(lt, t0, t0 + d));
const ex = (lt, t1, d = .2) => easeIn(seg(lt, t1, t1 + d));

// camera view over an image. cam = [cx, cy, w] in source px; fn draws highlights in source px
function view(im, d, cam, fn, o = {}) {
  const s = d.w / cam[2];
  g.save(); rr(d.x, d.y, d.w, d.h, 14 * u); g.clip(); g.fillStyle = o.fill || '#f7f4ee'; g.fillRect(d.x, d.y, d.w, d.h);
  g.translate(d.x + d.w / 2 - cam[0] * s, d.y + d.h / 2 - cam[1] * s); g.scale(s, s); g.imageSmoothingQuality = 'high';
  if (im) { if (o.iw) g.drawImage(im, 0, 0, o.iw, o.ih); else g.drawImage(im, 0, 0); }
  if (fn) fn(s);
  g.restore();
}
function hl(x, y, w, h, s, color, k = 1, pad = 7) {   // highlight box, source px, no glow
  g.save(); g.globalAlpha = k; g.strokeStyle = color; g.lineWidth = Math.max(2, 3.4 * u) / s; g.beginPath(); g.roundRect(x - pad, y - pad * .6, w + pad * 2, h + pad * 1.2, 8 / s * 2); g.stroke();
  g.fillStyle = color; g.globalAlpha = .1 * k; g.fill(); g.restore();
}
function shadow(d) { g.save(); rr(d.x, d.y, d.w, d.h, 14 * u); g.strokeStyle = 'rgba(247,244,238,.10)'; g.lineWidth = 2 * u; g.stroke(); g.restore(); }

// ---- layouts
function slots(mode) { const o = slots0(mode); o.mode = mode; return o; }
function slots0(mode) {
  if (P) return mode === 'split'
    ? { panel: { x: 48 * u, y: 150 * u, w: 984 * u, h: 960 * u }, tx: 64 * u, ty: 1170 * u, tw: 952 * u, main: 58 * u, sub: 31 * u, chipY: 1500 * u }
    : { panel: { x: 40 * u, y: 150 * u, w: 1000 * u, h: 880 * u }, tx: 64 * u, ty: 1100 * u, tw: 952 * u, main: 50 * u, sub: 30 * u, chipY: 1400 * u };
  return mode === 'split'
    ? { panel: { x: 960 * u, y: 70 * u, w: 900 * u, h: 940 * u }, tx: 110 * u, ty: 330 * u, tw: 760 * u, main: 66 * u, sub: 29 * u, chipY: 900 * u }
    : { panel: { x: 210 * u, y: 40 * u, w: 1500 * u, h: 844 * u }, tx: 210 * u, ty: 985 * u, tw: 1500 * u, main: 40 * u, sub: 27 * u, chipY: 920 * u };
}
// statement: [[t0, t1, main, sub, accent?]] with a line-reveal (clip + rise), never a plain fade
function statement(lt, list, S, o = {}) {
  const cur = list.find(s => lt >= s[0] && lt < s[1] + (s.last ? 99 : 0)); if (!cur) return;
  const [t0, t1, main, sub, col] = cur, r = ap(lt, t0, .5), e = ex(lt, t1, .22);
  const ml = wrap(main, S.main, S.tw, F.d, 400), sl = sub ? wrap(sub, S.sub, S.tw, F.s, 400) : [];
  const mlh = S.main * 1.12, slh = S.sub * 1.42, h = ml.length * mlh + (sl.length ? 28 * u + sl.length * slh : 0);
  const wide = S.mode === 'wide';
  let y0 = o.y ?? (P || wide ? S.ty : S.ty + (o.dy || 0) - h / 2 + 60 * u);
  g.save(); g.beginPath(); g.rect(S.tx - 20 * u, y0 - S.main, S.tw + 40 * u, h + S.main * .6); g.clip();
  const off = (1 - r) * S.main * .9 - e * S.main * .7; g.globalAlpha = Math.min(1, r * 1.6) * (1 - e);
  ml.forEach((l, i) => text(l, wide && !P ? S.tx + S.tw / 2 : S.tx, y0 + off + i * mlh, S.main, { font: F.d, weight: 400, color: col || C.ink, align: wide && !P ? 'center' : 'left' }));
  sl.forEach((l, i) => text(l, wide && !P ? S.tx + S.tw / 2 : S.tx, y0 + off + ml.length * mlh + 28 * u + i * slh - S.main * .55 + S.sub, S.sub, { color: C.mute, align: wide && !P ? 'center' : 'left' }));
  g.restore();
}
// panel entrance: rises on a heavy spring, from the ground
function enter(d, lt, fn) {
  const k = spring(lt - .05, 90, 20); g.save(); g.globalAlpha = clamp(k * 3, 0, 1); g.translate(0, (1 - k) * 60 * u); fn(d); g.restore();
}
const track2 = (lt, keys) => trackN(lt, keys, 110, 24);

// ---- sheet geometry: regions in sheet-local "display units"; K converts to source px of sheet-recorded-open.png
const R = { holds: [34, 78, 196, 70], score: [405, 290, 125, 66], proposed: [34, 455, 200, 70], supports: [346, 455, 200, 70], window: [656, 455, 200, 70],
  bond: [34, 560, 150, 70], reward: [346, 560, 150, 70], cost: [656, 560, 150, 70], receipt: [34, 730, 863, 44], hash: [742, 738, 155, 26],
  rej: [34, 785, 430, 35], reason: [34, 828, 520, 34], single: [172, 216, 125, 26], testnet: [314, 216, 152, 26] };
const K = () => (IMG.sheet ? IMG.sheet.naturalWidth / 931 : 1.44);
const sc = cam => [cam[0] * K(), cam[1] * K(), cam[2] * K()];
function hlS(name, s, color, k = 1) { const r = R[name], q = K(); hl(r[0] * q, r[1] * q, r[2] * q, r[3] * q, s, color, k); }

// ---- shots: each has stm (statements), seqs? (flow frames needed), draw(lt)
const SH = {};
const chips1 = (lt, S, items, t0 = 0) => chipRow(items, S.tx, S.chipY, S.tw, ap(lt, t0 + .3));

SH.s01 = { draw(lt) {

    const cam = track2(lt, [[0, [190, 595, 420]], [2.4, [420, 595, 420]], [4.8, [750, 490, 440]]]);
    view(IMG.sheet, d, sc(cam), s => {
      hlS('bond', s, C.amber, ap(lt, .5)); hlS('reward', s, C.amber, ap(lt, 2.9)); hlS('window', s, C.red, ap(lt, 5.3));
    }); shadow(d);
  });
  statement(lt, [[0, 2.4, 'A proposer puts up a $250 bond to say who won.', 'On UMA\'s oracle, for a Polymarket market.'], [2.4, 4.8, 'The reward is $0.80.', 'Bond $250.00, reward $0.80 on this market.'], [4.8, 7.2, 'If the answer is wrong and nobody disputes it, it stands.', 'The dispute window closes. A successful dispute costs the bond.']], S);
  chips1(lt, S, [['Recorded market: Flames vs. Avalanche', C.mute], ['Sepolia testnet', C.amber]], 0);
} };

    view(IMG.land, d, cam, s => { hl(2618, 40, 200, 34, s, C.amber, ap(lt, 5.2)); }); shadow(d);

  text('Gainsay', S.tx, by + (1 - r) * big, big, { font: F.d, weight: 500 }); g.restore();
  statement(lt, [[0, 2.4, 'Check a resolution before the bond goes up.'], [2.4, 4.8, 'Paste a Polymarket link or market id.'], [4.8, 7.2, 'Evidence is paid in test USDC on Ethereum Sepolia.']], S, { y: by + 90 * u });
  chips1(lt, S, [['Live: gainsay.up.railway.app', C.blue], ['Sepolia testnet', C.amber]], 0);
} };

SH.s03 = { draw(lt) {
  const S = slots('split'), d = S.panel;
  enter(d, lt, d => {
    const cam = track2(lt, [[0, [465, 443, 960]], [2.4, [300, 130, 600]], [4.8, [465, 345, 700]], [7.2, [465, 540, 931]], [9.6, [465, 760, 760]], [12.0, [300, 235, 560]], [14.4, [465, 443, 960]]]);
    view(IMG.sheet, d, sc(cam), s => {
      const w = (a, b) => Math.min(ap(lt, a, .3), 1 - ex(lt, b, .2));
      hlS('holds', s, C.green, w(2.7, 4.7)); hlS('score', s, C.green, w(5.1, 7.1));
      hlS('proposed', s, C.blue, w(7.5, 9.5)); hlS('supports', s, C.blue, w(7.7, 9.5)); hlS('window', s, C.amber, w(8.0, 9.5)); hlS('cost', s, C.blue, w(8.3, 9.5));
      hlS('receipt', s, C.blue, w(9.9, 11.9)); hlS('hash', s, C.green, w(10.4, 11.9));
      hlS('single', s, C.amber, w(12.3, 14.3)); hlS('testnet', s, C.amber, w(12.6, 14.3));
    }); shadow(d);
  });
  statement(lt, [[0, 2.4, 'It reads the proposal from UMA\'s oracle on Polygon.', 'Then buys the final score through Telegraph.'],
    [2.4, 4.8, 'Holds. The final score supports Avalanche.', null, C.green], [4.8, 7.2, 'Flames 2, Avalanche 5. Final.', 'Bought for $0.01 from the NHL\'s official feed.'],
    [7.2, 9.6, 'The proposal, the bond and the cost, side by side.', 'Proposed Avalanche. Score supports Avalanche.'], [9.6, 12.0, 'Every answer carries a receipt.', 'NHL official, provider 44002. Signal 0xfa08b5f9…a0e41'],
    [12.0, 14.4, 'It says when it rests on one source.', 'Single source. Testnet evidence.', C.amber], [14.4, 16.8, 'A real check on a real proposal, 1 Nov 2026.', 'It ran after the dispute window had closed.']], S);
  chips1(lt, S, [['Recorded check, 1 Nov 2026', C.mute], ['Sepolia test USDC', C.amber], ['Window had closed', C.mute]], 0);
} };

// Evidence card drawn in film style (no screenshot exists for these): dark card, mono lines
function evCard(d, rows, lt, o = {}) {
  g.save(); rr(d.x, d.y, d.w, d.h, 14 * u); g.fillStyle = C.card; g.fill(); g.strokeStyle = C.line; g.lineWidth = 2 * u; g.stroke(); g.clip();
  const pad = 44 * u; let y = d.y + pad;
  rows.forEach((r, i) => {
    const k = ap(lt, r.t ?? i * .35, .4); if (k <= 0) return;
    g.save(); g.globalAlpha = k; y += 0;
    const size = (r.size || 28) * u, ls = wrap(r.s, size, d.w - 2 * pad, r.font || F.s, r.weight || 400);
    ls.forEach((l, j) => text(l, d.x + pad, y + size + (1 - k) * 18 * u + j * size * 1.3, size, { font: r.font || F.s, weight: r.weight || 400, color: r.color || C.ink }));
    g.restore(); y += ls.length * size * 1.3 + (r.gap ?? 22) * u;
  });
  g.restore(); return y;
}
SH.s04 = { draw(lt) {

    { s: 'Timberwolves vs. Rockets: O/U 196.5', size: 30, color: C.mute, t: .1 }, { s: 'Holds', font: F.d, size: 150, color: C.green, t: .3, gap: 10 },
    { s: 'Proposed Over. Timberwolves 117, Rockets 107. Final.', size: 31, t: .8, gap: 36 },
    { s: 'Provider  SportWire (ESPN), miner 7331', font: F.m, size: 23, color: C.mute, t: 1.3, gap: 10 }, { s: 'Cost      $0.01 through Telegraph', font: F.m, size: 23, color: C.mute, t: 1.6, gap: 10 },
    { s: 'Signal    0x164c2229…a9d67', font: F.m, size: 23, color: C.blue, t: 1.9, gap: 36 },
    { s: 'Matches ESPN\'s scoreboard and Polymarket\'s settlement.', size: 27, t: 2.9, gap: 10 }, { s: 'Single source.', size: 27, color: C.amber, weight: 500, t: 3.6 },
  ], lt - 0));
  statement(lt, [[0, 3.6, 'A second sport, a second provider.', 'Over/under settled by arithmetic on the final score.'], [3.6, 7.2, 'Run through the live site.', 'Total 224 against a line of 196.5: Over.']], S);
  chips1(lt, S, [['Live site check, 5 Nov 2026', C.blue], ['Sepolia test USDC', C.amber], ['Window had closed', C.mute]], 0);
} };

SH.s05 = { draw(lt) {
  const S = slots('split'), d = S.panel;

  else enter(d, lt - 4.8, d => evCard(d, [
    { s: 'Asked: Pistons vs. Knicks, 27 Oct', size: 29, color: C.mute, t: .1, gap: 14 }, { s: 'Answered: Real Madrid 2, Barcelona 1', font: F.d, size: 52, t: .5, gap: 30 },
    { s: 'every field   ok', font: F.m, size: 25, color: C.mute, t: 1.3, gap: 8 }, { s: 'signal        verified: true', font: F.m, size: 25, color: C.mute, t: 1.7, gap: 30 },
    { s: 'Wrong game.', font: F.d, size: 80, color: C.red, t: 2.5, gap: 22 }, { s: 'Reported as bounties#177.', size: 26, color: C.mute, t: 3.4 },
  ], lt - 4.8));
  statement(lt, [[0, 4.8, 'It rejects answers about the wrong game.', 'Teams must match and the kickoff must be within three hours. Here: 9 answers rejected.'],
    [4.8, 12.0, 'Our first paid answers were about other games.', 'Verified proves the record was not altered. It does not prove the answer is about your game.']], S);
  chips1(lt, S, lt < 4.8 ? [['Recorded check, 1 Nov 2026', C.mute]] : [['Real paid answers, 1 Nov 2026', C.mute], ['Sepolia test USDC', C.amber]], 0);
} };

// flow shots (wide)
function flowShot(name, ftOf, cams, caps, chips, hlf) {
  return { seqs: lt => [[name, ftOf(lt)]], draw(lt) {
    const S = slots('wide'), d = S.panel, im = CUR[name];
    enter(d, lt, d => view(im, d, track2(lt, cams), s => hlf && hlf(lt, s), { iw: 1920, ih: 1080 })); shadow(d);
    statement(lt, caps, S);
    chipRow(chips, P ? S.tx : S.tx + 0, S.chipY, S.tw, ap(lt, .4));
  } };
}
const pc = (a, b, c) => P ? b : a;   // landscape value, portrait value
SH.s06a = flowShot('te', lt => .7 + lt, [[0, P ? [420, 600, 900] : [960, 540, 1920]], [3.0, [1368, 530, P ? 1100 : 1150]]],
  [[0, 7.2, 'Too early: the game has not started.', 'Nothing is bought. Evidence cost $0.00.']],
  [['Live site, 26 Nov 2026', C.blue], ['Bears vs. Lions, NFL', C.mute], ['Kickoff 18:00 UTC', C.mute]],
  (lt, s) => { hl(900, 295, 330, 90, s, C.amber, ap(lt, 3.5, .3)); hl(890, 770, 780, 50, s, C.blue, ap(lt, 4.8, .3)); });

  [['Live site, 26 Nov 2026', C.blue], ['Devin Booker: Assists O/U 5.5', C.mute]],
  (lt, s) => { hl(900, 295, 380, 90, s, C.amber, ap(lt, 4.6, .3)); });

// ---- timeline lookup + master draw
function locate(t) {
  if (P) {
    if (PL) { const sg = PL.vseg.find(g => t < g.off + (g.rb - g.ra)) || PL.vseg[PL.vseg.length - 1], sh = SHOTS.find(x => x.id === sg.id), r = Math.min(sg.rb - .001, sg.ra + (t - sg.off)); return { shot: sh, id: sg.id, lt: r2d(sh, sh.from + r) }; }
    let off = 0; for (const [id, a, b] of VSEG) { if (t < off + (b - a) || id === VSEG[VSEG.length - 1][0]) return { shot: SHOTS.find(s => s.id === id), id, lt: a + Math.min(t - off, b - a - .001) }; off += b - a; }
  }
  const s = SHOTS.find(s => t >= s.from && t < s.to) || SHOTS[SHOTS.length - 1]; return { shot: s, id: s.id, lt: r2d(s, t) };
}
window.seek = async t => {
  const { id, lt } = locate(t), sh = SH[id];
  if (sh.seqs) for (const [n, ft] of sh.seqs(lt)) CUR[n] = await seqFrame(n, ft);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  sh.draw(lt);
};
